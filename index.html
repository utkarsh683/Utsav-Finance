<!DOCTYPE html>
<html lang="en" data-theme="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#1e40af">
<title>UTSAV-FINANCE — Smart • Simple • Accurate</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="indigo"]{--primary:#1e40af;--primary-600:#1e3a8a;--primary-50:#eff6ff;--primary-100:#dbeafe;--primary-grad:linear-gradient(135deg,#1e40af,#0891b2);--secondary:#0891b2;}
[data-theme="ocean"]{--primary:#0891b2;--primary-600:#0e7490;--primary-50:#ecfeff;--primary-100:#cffafe;--primary-grad:linear-gradient(135deg,#06b6d4,#0ea5e9);--secondary:#0284c7;}
[data-theme="emerald"]{--primary:#059669;--primary-600:#047857;--primary-50:#ecfdf5;--primary-100:#d1fae5;--primary-grad:linear-gradient(135deg,#10b981,#34d399);--secondary:#0d9488;}
[data-theme="sunset"]{--primary:#ea580c;--primary-600:#c2410c;--primary-50:#fff7ed;--primary-100:#ffedd5;--primary-grad:linear-gradient(135deg,#f97316,#fbbf24);--secondary:#d97706;}
[data-theme="rose"]{--primary:#e11d48;--primary-600:#be123c;--primary-50:#fff1f2;--primary-100:#ffe4e6;--primary-grad:linear-gradient(135deg,#f43f5e,#ec4899);--secondary:#be185d;}
:root{--bg:#f1f4fa;--bg-alt:#e8edf7;--card:#ffffff;--card-alt:#f8fafc;--text:#0f172a;--text-2:#334155;--muted:#64748b;--border:#e2e8f0;--border-2:#cbd5e1;--success:#16a34a;--success-50:#ecfdf5;--danger:#dc2626;--danger-50:#fef2f2;--warn:#d97706;--warn-50:#fffbeb;--info:#0891b2;--info-50:#ecfeff;--wa:#25d366;--sidebar-bg:#0a1428;--sidebar-text:#94a3b8;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 20px -6px rgba(16,24,40,.10);--shadow-lg:0 10px 40px -12px rgba(16,24,40,.22);--ring:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--bnav-h:66px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0a1428 0%,#1e3a8a 40%,#1e40af 100%);display:grid;place-items:center;transition:opacity .5s,visibility .5s;overflow:hidden}
.splash.hide{opacity:0;visibility:hidden}
.splash::before,.splash::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.splash::before{width:400px;height:400px;background:#0891b2;top:-100px;left:-100px;animation:float 6s ease-in-out infinite}
.splash::after{width:350px;height:350px;background:#fbbf24;bottom:-80px;right:-80px;animation:float 7s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
.splash-inner{position:relative;z-index:2;text-align:center;color:#fff}
.splash-logo{width:180px;height:180px;margin:0 auto 20px;animation:popScale .8s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));display:grid;place-items:center}
.splash-logo img,.splash-logo svg{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;padding:6px;box-shadow:0 0 40px rgba(255,255,255,.3)}
@keyframes popScale{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.splash-title{font-size:34px;font-weight:900;letter-spacing:-.8px;margin-bottom:6px;background:linear-gradient(135deg,#fff,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-tagline{font-size:11px;font-weight:700;letter-spacing:4px;color:#c7d2fe;text-transform:uppercase;margin-bottom:28px}
.splash-loader{width:220px;height:4px;background:rgba(255,255,255,.2);border-radius:20px;margin:0 auto;overflow:hidden}
.splash-loader i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:20px;animation:loadBar 1.8s ease-in-out infinite}
@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.splash-foot{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;letter-spacing:2px}

/* LOGIN — uses second image as background */
.login-screen{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;transition:opacity .4s,visibility .4s}
.login-screen::before{
  content:"";position:absolute;inset:0;
  background:url('login-bg.jpg') center/cover no-repeat;
  z-index:-2;
}
.login-screen::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(10,20,40,.78) 0%, rgba(30,58,138,.72) 50%, rgba(8,145,178,.70) 100%);
  z-index:-1;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.login-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.login-card{background:rgba(255,255,255,.97);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.5);border-radius:24px;padding:34px 28px 26px;max-width:400px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1) inset;position:relative;z-index:2;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.login-logo{width:110px;height:110px;margin:0 auto 14px;display:grid;place-items:center;filter:drop-shadow(0 8px 20px rgba(30,64,175,.3))}
.login-logo img,.login-logo svg{width:100%;height:100%;object-fit:contain;border-radius:50%}
.login-title{text-align:center;font-size:24px;font-weight:900;letter-spacing:-.6px;color:#0f172a;margin-bottom:4px}
.login-title span{background:linear-gradient(135deg,#1e40af,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{text-align:center;font-size:10.5px;font-weight:800;color:#64748b;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:22px}
.login-sanskrit{text-align:center;font-size:11px;color:#1e40af;font-style:italic;font-weight:700;margin-bottom:18px;letter-spacing:.3px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px}
.login-field .inp-wrap{position:relative}
.login-field input{width:100%;height:48px;padding:0 44px 0 44px;border-radius:12px;background:#f8fafc;border:1.5px solid #e2e8f0;font-size:14px;font-weight:600;outline:none;transition:all .15s;color:#0f172a}
.login-field input:focus{border-color:#1e40af;background:#fff;box-shadow:0 0 0 4px rgba(30,64,175,.12)}
.login-field .inp-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.login-field .toggle-pw{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:#64748b}
.login-btn{width:100%;height:50px;border-radius:12px;background:linear-gradient(135deg,#1e40af,#0891b2);color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px;margin-top:8px;box-shadow:0 10px 24px -8px rgba(30,64,175,.8);transition:transform .1s,box-shadow .2s}
.login-btn:active{transform:scale(.98)}
.login-hint{text-align:center;font-size:11.5px;color:#64748b;margin-top:16px;padding:10px;background:#f8fafc;border-radius:10px;font-weight:600;border:1px dashed #e2e8f0}
.login-hint b{color:#1e40af}
.login-err{background:#fef2f2;color:#dc2626;padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:700;margin-bottom:12px;display:none;border:1px solid #fecaca}
.login-err.show{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* APP */
.app{display:none;min-height:100vh;min-height:100dvh}
.app.show{display:flex}
.sidebar{width:260px;flex:0 0 260px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;z-index:60;border-right:1px solid rgba(255,255,255,.05);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.brand-logo-img{width:50px;height:50px;flex:0 0 50px;border-radius:50%;box-shadow:0 6px 18px -6px rgba(8,145,178,.7);background:#fff;padding:3px;display:grid;place-items:center;overflow:hidden}
.brand-logo-img img,.brand-logo-img svg{width:100%;height:100%;object-fit:contain;border-radius:50%}
.brand-txt h1{font-size:14px;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1.1}
.brand-txt span{font-size:8px;font-weight:800;color:#38bdf8;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 14px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#4b5a72;padding:16px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10.5px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--sidebar-text);transition:background .15s,color .15s;width:100%;text-align:left;position:relative}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex:0 0 20px;filter:grayscale(.35)}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nav-item:hover .ico{filter:none}
.nav-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 40%,transparent),color-mix(in srgb,var(--primary) 10%,transparent));color:#fff}
.nav-item.active .ico{filter:none}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:#38bdf8}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.12);color:#c7d2fe;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25);color:#fff}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05)}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--primary-grad)}
.user-chip .u-meta{min-width:0;flex:1}
.user-chip .u-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .u-role{font-size:11px;color:#8b9ab1}
.logout-btn{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:rgba(239,68,68,.15);color:#fca5a5;font-size:12px;font-weight:700;transition:background .15s}
.logout-btn:hover{background:rgba(239,68,68,.3);color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 20px 10px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
.hamburger{display:none}
.page-head{min-width:0;flex:1}
.page-head h2{font-size:18px;font-weight:800;letter-spacing:-.4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-head p{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;font-size:16px;color:var(--text-2);background:var(--card-alt);border:1px solid var(--border);transition:background .15s,transform .1s}
.icon-btn:hover{background:var(--bg-alt);border-color:var(--border-2)}
.icon-btn:active{transform:scale(.92)}
.event-picker{display:flex;align-items:center;gap:8px;background:var(--card-alt);border:1px solid var(--border);border-radius:11px;padding:0 10px;height:40px;max-width:240px}
.event-picker .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:0 0 8px;box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
.event-picker select{border:none;background:transparent;font-size:13px;font-weight:600;outline:none;max-width:180px;cursor:pointer;color:var(--text)}
.content{padding:22px;flex:1;max-width:1500px;width:100%;margin:0 auto}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-lg)}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.card-head .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.card-body{padding:18px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:650;transition:transform .1s,background .15s,box-shadow .15s,border-color .15s;white-space:nowrap;border:1px solid transparent;user-select:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px -4px color-mix(in srgb,var(--primary) 70%,transparent)}
.btn.primary:hover{background:var(--primary-600)}
.btn.ghost{background:var(--card-alt);color:var(--text-2);border-color:var(--border)}
.btn.ghost:hover{background:var(--bg-alt);border-color:var(--border-2)}
.btn.danger{background:var(--danger-50);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 25%,transparent)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.success{background:var(--success-50);color:var(--success);border-color:color-mix(in srgb,var(--success) 25%,transparent)}
.btn.success:hover{background:var(--success);color:#fff}
.btn.excel{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.btn.excel:hover{background:#047857;color:#fff;border-color:#047857}
.btn.pdf{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.btn.pdf:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
.btn.wa{background:#dcfce7;color:#166534;border-color:#86efac}
.btn.wa:hover{background:#25d366;color:#fff;border-color:#25d366}
.btn.sms{background:var(--primary-50);color:var(--primary-600);border-color:var(--primary-100)}
.btn.sms:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.img{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.btn.img:hover{background:#f59e0b;color:#fff;border-color:#f59e0b}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.xs{height:30px;padding:0 8px;font-size:11.5px;border-radius:8px;font-weight:700}
.btn.block{width:100%}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:650;color:var(--text-2);letter-spacing:.1px;display:flex;align-items:center;gap:6px}
.field .hint{font-size:11px;color:var(--muted);font-weight:500}
.field .req{color:var(--danger)}
.inp-voice{position:relative;display:flex;align-items:stretch;gap:6px}
.inp-voice input,.inp-voice textarea{flex:1;padding-right:42px}
.inp-voice .mic-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary);font-size:15px;transition:all .15s;z-index:2}
.inp-voice .mic-btn:hover{background:var(--primary);color:#fff}
.inp-voice .mic-btn.listening{background:#dc2626;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.inp-voice textarea{padding-right:42px}
.inp-voice .mic-btn.ta{top:auto;bottom:8px;transform:none}

input,select,textarea{height:44px;padding:0 12px;border-radius:10px;background:var(--card-alt);border:1px solid var(--border);font-size:14px;font-weight:550;outline:none;width:100%;transition:border-color .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:var(--ring);background:var(--card)}
select{cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}

.search{position:relative;flex:1;min-width:170px;max-width:360px}
.search input{padding-left:38px;height:42px}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}

.kpi-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,transparent),transparent 60%);pointer-events:none}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--primary))}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.kpi-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--accent) 13%,transparent)}
.kpi-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.kpi-value{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:5px}

.quick-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:18px}
.quick-card{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s;cursor:pointer}
.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.quick-card:active{transform:scale(.98)}
.quick-card .qc-ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff}
.quick-card .qc-t{font-size:14px;font-weight:750}
.quick-card .qc-s{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:2px}
.qc-in .qc-ico{background:linear-gradient(135deg,#16a34a,#4ade80)}
.qc-out .qc-ico{background:linear-gradient(135deg,#dc2626,#f87171)}
.qc-pend .qc-ico{background:linear-gradient(135deg,#d97706,#fbbf24)}
.qc-seva .qc-ico{background:linear-gradient(135deg,#7c3aed,#a855f7)}

.grid-2{display:grid;gap:16px;grid-template-columns:1.35fr 1fr}
.grid-2e{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.mb16{margin-bottom:16px}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:11px 14px;background:var(--card-alt);border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-weight:550}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--card-alt)}
table.tbl tbody tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}
.amt-in{color:var(--success)}
.amt-out{color:var(--danger)}
.t-right{text-align:right}
.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.15px;white-space:nowrap}
.pill.gray{background:var(--card-alt);color:var(--muted);border:1px solid var(--border)}
.pill.green{background:var(--success-50);color:var(--success)}
.pill.red{background:var(--danger-50);color:var(--danger)}
.pill.amber{background:var(--warn-50);color:var(--warn)}
.pill.blue{background:var(--primary-50);color:var(--primary)}
.pill.cyan{background:var(--info-50);color:var(--info)}
.pill.purple{background:#f5f3ff;color:#7c3aed}
.pill.img{background:#fef3c7;color:#92400e}

.av-sm{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--primary-grad)}
.cell-user{display:flex;align-items:center;gap:10px;min-width:0}
.cell-user .cu-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-user .cu-sub{font-size:11.5px;color:var(--muted);font-weight:550}

.empty{padding:52px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .e-ico{font-size:42px;opacity:.45;margin-bottom:4px}
.empty h4{font-size:15px;font-weight:750}
.empty p{font-size:13px;color:var(--muted);max-width:340px}

.prog{height:7px;border-radius:20px;background:var(--bg-alt);overflow:hidden;min-width:80px}
.prog > i{display:block;height:100%;border-radius:20px;background:var(--primary-grad);transition:width .4s}
.prog.green > i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.prog.amber > i{background:linear-gradient(90deg,#d97706,#fbbf24)}

.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 2px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:145px;width:100%;justify-content:center}
.chart-bars i{display:block;width:11px;max-width:42%;border-radius:5px 5px 2px 2px;transition:height .5s cubic-bezier(.2,.9,.3,1);min-height:3px}
.bar-in{background:linear-gradient(180deg,var(--primary),var(--secondary))}
.bar-out{background:linear-gradient(180deg,#f87171,#fca5a5)}
.chart-lbl{font-size:10.5px;font-weight:650;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

.cat-row{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;gap:10px}
.cat-top .cv{color:var(--muted);font-variant-numeric:tabular-nums}
.cat-bar{height:8px;border-radius:20px;background:var(--bg-alt);overflow:hidden}
.cat-bar > i{display:block;height:100%;border-radius:20px;transition:width .5s}

.act-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none;padding-bottom:0}
.act-ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:15px}
.act-ico.in{background:var(--success-50)}
.act-ico.out{background:var(--danger-50)}
.act-meta{flex:1;min-width:0}
.act-meta .am-t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-meta .am-s{font-size:11.5px;color:var(--muted);font-weight:550}
.act-amt{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

.event-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.event-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.event-card.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50),var(--shadow)}
.event-card .ec-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.event-card .ec-ico{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--primary-50)}
.event-card h4{font-size:15px;font-weight:750;letter-spacing:-.2px;line-height:1.25}
.event-card .ec-sub{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:2px}
.ec-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.ec-stat{background:var(--card-alt);border-radius:10px;padding:9px 11px}
.ec-stat .es-l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ec-stat .es-v{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}

.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .16s ease;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);animation:popIn .2s cubic-bezier(.2,.9,.3,1);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border:1px solid var(--border)}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--border);flex:0 0 auto;position:relative}
.modal-head h3{font-size:16px;font-weight:780;letter-spacing:-.3px;flex:1}
.modal-body{padding:20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--border);flex:0 0 auto;background:var(--card-alt);border-radius:0 0 18px 18px;flex-wrap:wrap}
.modal-handle{display:none}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--success);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:650;min-width:230px;max-width:340px;display:flex;align-items:center;gap:10px;animation:slideIn .22s cubic-bezier(.2,.9,.3,1);pointer-events:auto}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.err{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--info)}
.toast.warn{border-left-color:var(--warn)}

.seg{display:inline-flex;background:var(--card-alt);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.1)}

.sum-strip{display:grid;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sum-cell{background:var(--card);padding:15px 17px}
.sum-cell .sc-l{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.sum-cell .sc-v{font-size:19px;font-weight:800;letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums}

.seva-form{display:grid;gap:14px;grid-template-columns:1fr 1fr 1fr auto auto;align-items:end}
@media (max-width:900px){.seva-form{grid-template-columns:1fr 1fr}.seva-form .field:last-of-type{grid-column:1/-1}}

.preview-box{background:var(--primary-50);border:1px dashed var(--primary);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.65;color:var(--text);position:relative}
.preview-box .pb-label{position:absolute;top:-9px;left:12px;background:var(--primary);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.preview-box .pb-msg{font-style:italic}

.themes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.theme-swatch{padding:14px 10px;border-radius:14px;border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:transform .15s,border-color .15s}
.theme-swatch:hover{transform:translateY(-2px)}
.theme-swatch.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.theme-swatch .sw-dot{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800}
.theme-swatch .sw-name{font-size:12px;font-weight:750;color:var(--text-2)}

.logo-manager{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:700px){.logo-manager{grid-template-columns:1fr}}
.logo-preview-card{background:var(--card-alt);border:2px dashed var(--border);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:220px;justify-content:center}
.logo-preview-box{width:140px;height:140px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 8px 24px -8px rgba(0,0,0,.15);display:grid;place-items:center;overflow:hidden;border:3px solid var(--primary-50)}
.logo-preview-box img,.logo-preview-box svg{width:100%;height:100%;object-fit:contain;border-radius:50%}
.logo-upload-zone{border:2px dashed var(--primary-100);background:var(--primary-50);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:all .15s}
.logo-upload-zone:hover{border-color:var(--primary);background:var(--primary-100)}
.logo-upload-zone .uz-ico{font-size:36px;margin-bottom:6px}
.logo-upload-zone .uz-t{font-size:13.5px;font-weight:750;color:var(--primary-600)}
.logo-upload-zone .uz-s{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.logo-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.logo-presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-top:14px}
.logo-preset{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;padding:5px;border:2px solid var(--border);cursor:pointer;transition:all .15s;display:grid;place-items:center}
.logo-preset:hover{border-color:var(--primary);transform:scale(1.06)}
.logo-preset.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.logo-preset img,.logo-preset svg{width:100%;height:100%;object-fit:contain;border-radius:50%}

.bg-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.bg-option{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid var(--border);background:#000;transition:all .15s}
.bg-option:hover{transform:scale(1.03);border-color:var(--primary-600)}
.bg-option.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.bg-option img{width:100%;height:100%;object-fit:cover;display:block}
.bg-option .bg-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:11px;font-weight:700;padding:20px 10px 8px;text-align:center}
.bg-option .bg-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:none;place-items:center;font-size:13px;font-weight:900}
.bg-option.active .bg-check{display:grid}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);padding:6px 4px;padding-bottom:max(6px,var(--safe-b))}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.1px;transition:color .15s,background .15s;min-height:56px;justify-content:center}
.bottom-nav button .bn-ico{font-size:20px;line-height:1;filter:grayscale(.55)}
.bottom-nav button.active{color:var(--primary);background:var(--primary-50)}
.bottom-nav button.active .bn-ico{filter:none}
.bottom-nav button:active{transform:scale(.92)}

.fab-wrap{display:none;position:fixed;right:16px;bottom:calc(var(--bnav-h) + 16px + var(--safe-b));z-index:65;flex-direction:column-reverse;align-items:flex-end;gap:10px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--primary-grad);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:300;box-shadow:0 10px 28px -6px color-mix(in srgb,var(--primary) 60%,transparent),0 4px 12px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.2,.9,.3,1);line-height:1}
.fab:active{transform:scale(.92)}
.fab-wrap.open .fab{transform:rotate(45deg)}
.fab-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-end;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .25s}
.fab-wrap.open .fab-actions{opacity:1;pointer-events:auto;transform:none}
.fab-action{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:30px;padding:8px 8px 8px 16px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:700;color:var(--text)}
.fab-action .fa-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#fff}
.fab-action.in .fa-ico{background:linear-gradient(135deg,#16a34a,#4ade80)}
.fab-action.out .fa-ico{background:linear-gradient(135deg,#dc2626,#f87171)}
.fab-action.pend .fa-ico{background:linear-gradient(135deg,#d97706,#fbbf24)}
.fab-action.seva .fa-ico{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.fab-scrim{display:none;position:fixed;inset:0;z-index:64;background:rgba(15,23,42,.35);backdrop-filter:blur(2px)}
.fab-scrim.show{display:block}

.msearch{display:none;position:fixed;inset:0;z-index:150;background:var(--bg);flex-direction:column;animation:fadeIn .15s ease}
.msearch.show{display:flex}
.msearch-bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--card);border-bottom:1px solid var(--border)}
.msearch-bar .search{max-width:none}
.msearch-body{flex:1;overflow-y:auto;padding:14px}

.mlist{display:none;padding:12px;gap:10px;flex-direction:column}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.mcard-top{display:flex;align-items:flex-start;gap:11px}
.mcard-top .av-sm{width:38px;height:38px;flex:0 0 38px;font-size:13px}
.mcard-info{flex:1;min-width:0}
.mcard-info .mc-t{font-size:14.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard-info .mc-s{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.mcard-amt{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mcard-meta{display:flex;gap:6px;flex-wrap:wrap}
.mcard-actions{display:flex;gap:7px;padding-top:9px;border-top:1px solid var(--border);flex-wrap:wrap}
.mcard-actions .btn{flex:1;min-width:80px;height:36px;font-size:12px}

.receipt-img-preview{background:#fff;border-radius:12px;padding:8px;border:1px solid var(--border);box-shadow:var(--shadow);margin:12px 0;text-align:center}
.receipt-img-preview img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.receipt-img-loading{padding:30px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}

@media (max-width:1150px){.grid-2{grid-template-columns:1fr}}
@media (max-width:980px){.grid-2e{grid-template-columns:1fr}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100dvh;transform:translateX(-100%);box-shadow:var(--shadow-lg);padding-top:var(--safe-t)}
  .sidebar.open{transform:none}
  .hamburger{display:grid}
  .content{padding:16px 14px calc(var(--bnav-h) + 24px + var(--safe-b))}
  .topbar{padding:calc(10px + var(--safe-t)) 14px 10px}
  .page-head h2{font-size:16.5px}
  .page-head p{display:none}
  .event-picker{max-width:150px}
  .event-picker select{max-width:96px;font-size:12.5px}
  .bottom-nav{display:flex}
  .fab-wrap{display:flex}
  .toast-wrap{bottom:calc(var(--bnav-h) + 16px + var(--safe-b));left:14px;right:14px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:13px}
  .kpi-value{font-size:20px}
  .kpi-ico{width:32px;height:32px;font-size:15px}
  .kpi-label{font-size:10px}
  .kpi-sub{font-size:10.5px}
  .form-grid{grid-template-columns:1fr}
  .content{padding:12px 12px calc(var(--bnav-h) + 24px + var(--safe-b))}
  .card-head{padding:13px 14px}
  .card-body{padding:14px}
  .toolbar{padding:12px 14px;gap:8px}
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{max-width:100%;border-radius:22px 22px 0 0;max-height:92dvh;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);border-bottom:none}
  .modal-head{padding:14px 18px 12px;position:relative}
  .modal-handle{display:block;position:absolute;top:6px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:20px;background:var(--border-2)}
  .modal-head h3{font-size:15px}
  .modal-body{padding:16px 18px}
  .modal-foot{flex-direction:row;padding:12px 18px calc(12px + var(--safe-b));border-radius:0}
  .modal-foot .btn{flex:1}
  .mlist{display:flex}
  .table-wrap{display:none}
  .toolbar .search{min-width:0;flex:1;max-width:none}
  .toolbar .seg{width:100%;justify-content:center;overflow-x:auto}
  .toolbar .seg button{flex:1;text-align:center;white-space:nowrap}
  .quick-grid{grid-template-columns:1fr 1fr;gap:10px}
  .quick-card{padding:12px;gap:10px}
  .quick-card .qc-ico{width:38px;height:38px;flex:0 0 38px;font-size:17px}
  .quick-card .qc-t{font-size:13px}
  .quick-card .qc-s{font-size:10.5px}
  .seva-form{grid-template-columns:1fr}
  .login-card{padding:26px 22px 20px}
  .login-title{font-size:20px}
  .splash-logo{width:140px;height:140px}
  .splash-title{font-size:26px}
  .kpi-grid{row-gap:10px}
  .grid-2,.grid-2e{gap:12px}
  .mcard-actions .btn{min-width:0;padding:0 10px}
  .receipt-img-preview img{max-height:220px}
}
@media (max-width:480px){
  .login-screen{padding:14px}
  .login-card{border-radius:20px;padding:22px 18px 18px}
  .splash-tagline{font-size:10px;letter-spacing:3px}
}
@media (max-width:420px){
  .kpi-grid{grid-template-columns:1fr}
  .event-picker{display:none}
  .fab{width:54px;height:54px;font-size:26px}
  .bottom-nav button{font-size:9.5px}
}
@media (hover:none) and (pointer:coarse){
  .btn{min-height:42px}
  .btn.xs{min-height:34px}
  .icon-btn{width:42px;height:42px}
  .nav-item{padding:12px}
}
@media print{

const DEFAULT_LOGIN_BG = 'login-bg.jpg';

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmtDate = iso=>{ if(!iso) return '—'; const d=new Date(iso+(iso.length===10?'T00:00:00':'')); return isNaN(d)?iso:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const shortDate = iso=>{ const d=new Date(iso+'T00:00:00'); return isNaN(d)?iso:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const debounce = (fn,ms=250)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
const isMobile = ()=> window.innerWidth <= 700;

function money(v,withSymbol=true){
  const n = num(v);
  const s = Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
  return (n<0?'-':'')+(withSymbol?(state.settings.currency||'₹'):'')+s;
}

/* ================= LOGO RENDERER ================= */
function renderLogo(size=48){
  const t = state.settings.logoType || 'default';
  if(t === 'custom' && state.settings.logoCustom){
    return `<img src="${state.settings.logoCustom}" alt="Logo">`;
  }
  if(t.startsWith('preset:')){
    const id = t.split(':')[1];
    return presetLogoSVG(id, size);
  }
  /* default = uploaded UTSAV-FINANCE logo */
  return `<img src="${DEFAULT_LOGO_SRC}" alt="UTSAV-FINANCE Logo" onerror="this.onerror=null;this.parentNode.innerHTML=defaultLogoSVG(${size})">`;
}

function defaultLogoSVG(size=48){
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
      <linearGradient id="lg2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    </defs>
    <circle cx="100" cy="100" r="96" fill="#fff"/>
    <circle cx="100" cy="100" r="96" fill="none" stroke="url(#lg1)" stroke-width="6"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="100" y="105" text-anchor="middle" font-size="52" font-weight="900" fill="url(#lg1)" font-family="Arial">UF</text>
    <text x="100" y="145" text-anchor="middle" font-size="15" font-weight="900" fill="#1e40af" font-family="Arial">UTSAV</text>
    <text x="100" y="165" text-anchor="middle" font-size="13" font-weight="900" fill="#ea580c" font-family="Arial">FINANCE</text>
  </svg>`;
}

function normalizeEvent(e){ return { id:e.id||uid('ev'), name:e.name||e.title||'Untitled Event', date:e.date||todayISO(), endDate:e.endDate||'', location:e.location||e.venue||'', budget:num(e.budget), description:e.description||'', status:e.status||'active' }; }
function normalizeDonation(d){ return { id:d.id||uid('dn'), eventId:d.eventId||'', donorName:d.donorName||d.name||'Anonymous', phone:d.phone||'', amount:num(d.amount), method:d.method||d.paymentMode||'Cash', date:d.date||todayISO(), note:d.note||d.remarks||'', receiptNo:d.receiptNo||'', smsSent:d.smsSent||false, smsSentAt:d.smsSentAt||'', imgSent:d.imgSent||false }; }
function normalizeExpense(e){ return { id:e.id||uid('ex'), eventId:e.eventId||'', category:e.category||'Misc', paidTo:e.paidTo||e.vendor||'', amount:num(e.amount), method:e.method||'Cash', date:e.date||todayISO(), note:e.note||e.remarks||'', voucherNo:e.voucherNo||'' }; }
function normalizePending(p){ return { id:p.id||uid('pd'), eventId:p.eventId||'', name:p.name||p.donorName||'Unknown', phone:p.phone||'', amount:num(p.amount), collected:num(p.collected||p.paid||0), dueDate:p.dueDate||'', note:p.note||'', status:p.status||'pending' }; }
function normalizeSeva(s){ return { id:s.id||uid('sv'), eventId:s.eventId||'', name:s.name||'', item:s.item||'', mobile:s.mobile||'', note:s.note||'', date:s.date||todayISO() }; }
function normalizeUser(u){ return { id:u.id||uid('us'), name:u.name||'User', role:u.role||'Volunteer', phone:u.phone||'', email:u.email||'', active:u.active!==false }; }

function migrate(raw){
  const base = blankState();
  if(!raw||typeof raw!=='object') return base;
  const out = Object.assign(base, raw);
  out.settings = Object.assign(base.settings, raw.settings||{});
  out.version = 3;
  out.events    = Array.isArray(raw.events)    ? raw.events.map(normalizeEvent)     : [];
  out.donations = Array.isArray(raw.donations) ? raw.donations.map(normalizeDonation): [];
  out.expenses  = Array.isArray(raw.expenses)  ? raw.expenses.map(normalizeExpense) : [];
  out.pendings  = Array.isArray(raw.pendings)  ? raw.pendings.map(normalizePending) : [];
  out.sevaItems = Array.isArray(raw.sevaItems) ? raw.sevaItems.map(normalizeSeva)   : [];
  out.users     = Array.isArray(raw.users)     ? raw.users.map(normalizeUser)       : [];
  if(!out.activeEventId) out.activeEventId = 'all';
  return out;
}

function load(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); }catch(e){}
  if(!raw){
    for(const k of LEGACY_KEYS){
      try{ const l = JSON.parse(localStorage.getItem(k)||'null'); if(l&&typeof l==='object'){ raw=l; break; } }catch(e){}

  state = migrate(raw);
  if(!state.events.length && !state.donations.length && !state.expenses.length && !state.sevaItems.length) seedDemo();

}

const activeEvent = ()=> state.events.find(e=>e.id===state.activeEventId) || null;

function scoped(list){ return state.activeEventId==='all' ? list : list.filter(x=>x.eventId===state.activeEventId); }
function totals(){
  const d = scoped(state.donations), e = scoped(state.expenses), p = scoped(state.pendings);
  const donations = d.reduce((s,x)=>s+num(x.amount),0);
  const expenses  = e.reduce((s,x)=>s+num(x.amount),0);
  const pendingAmt = p.reduce((s,x)=>s+Math.max(0,num(x.amount)-num(x.collected)),0);
  return { donations, expenses, balance:donations-expenses, pendingAmt, count:d.length, expCount:e.length, pendCount:p.length };
}
function nextReceiptNo(){
  const nums = state.donations.map(d=>parseInt(String(d.receiptNo||'').replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  return 'R-'+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
}
function nextVoucherNo(){
  const nums = state.expenses.map(d=>parseInt(String(d.voucherNo||'').replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  return 'V-'+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
}

/* SMS */
function buildSMS(donation){
  const ev = state.events.find(e=>e.id===donation.eventId);
  let msg = state.settings.smsTemplate || '';
  msg = msg.replace(/\{name\}/g, donation.donorName || 'Donor');
  msg = msg.replace(/\{amount\}/g, money(donation.amount));
  msg = msg.replace(/\{event\}/g, ev ? ev.name : 'our event');
  return msg;
}
function cleanPhone(phone){ const p = String(phone||'').replace(/\D/g,''); return p.length===10 ? '91'+p : p; }
function openSMSApp(phone, message){ window.location.href = `sms:${cleanPhone(phone)}?body=${encodeURIComponent(message)}`; }
function openWhatsApp(phone, message){ window.open(`https://wa.me/${cleanPhone(phone)}?text=${encodeURIComponent(message)}`,'_blank'); }
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(()=>fallbackCopy(text)); }
  else fallbackCopy(text);
}
function fallbackCopy(text){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Copy failed','err'); } document.body.removeChild(ta); }

function generateReceiptImage(donation){
  return new Promise(async (resolve, reject)=>{
    try{
      if(typeof html2canvas === 'undefined') throw new Error('html2canvas not loaded');
      const target = $('#renderTarget');
      target.innerHTML = receiptImageHTML(donation);
      await new Promise(r=>setTimeout(r,120));
      const canvas = await html2canvas(target,{ scale:2, backgroundColor:'#ffffff', useCORS:true, allowTaint:true, logging:false, windowWidth:700 });
      target.innerHTML = '';
      canvas.toBlob((blob)=>{ if(blob) resolve(blob); else reject(new Error('Blob failed')); }, 'image/png', 0.95);
    }catch(err){ console.warn('Receipt image failed:', err); reject(err); }
  });
}
function blobToDataURL(blob){ return new Promise((resolve,reject)=>{ const fr = new FileReader(); fr.onload = ()=>resolve(fr.result); fr.onerror = reject; fr.readAsDataURL(blob); }); }
function downloadBlob(blob, filename){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }

async function shareReceiptImage(donation, text){
  try{
    const blob = await generateReceiptImage(donation);
    const filename = `receipt-${(donation.receiptNo||donation.id).replace(/\W+/g,'-')}.png`;
    const file = new File([blob], filename, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{
        await navigator.share({ files:[file], text: text || buildSMS(donation), title: `Receipt · ${donation.receiptNo||''}` });
        const d = state.donations.find(x=>x.id===donation.id);
        if(d){ d.imgSent = true; if(!d.smsSent){ d.smsSent=true; d.smsSentAt=new Date().toISOString(); } save(); }
        toast('Receipt image shared ✓'); return true;
      }catch(err){ if(err.name==='AbortError'){ toast('Share cancelled','info'); return false; } console.warn(err); }
    }
    downloadBlob(blob, filename);
    toast('Receipt downloaded — attach in WhatsApp','info');
    const d = state.donations.find(x=>x.id===donation.id);
    if(d){ d.imgSent = true; save(); }
    if(donation.phone) setTimeout(()=> openWhatsApp(donation.phone, text || buildSMS(donation)), 700);
    return true;
  }catch(err){ console.error(err); toast('Image generation failed','err'); return false; }
}
async function downloadReceiptImage(donation){
  try{ const blob = await generateReceiptImage(donation); downloadBlob(blob, `receipt-${(donation.receiptNo||donation.id).replace(/\W+/g,'-')}.png`); toast('Downloaded'); }
  catch(err){ toast('Image failed','err'); }
}

async function autoSendSMS(donation){
  if(!state.settings.smsEnabled){ toast('SMS is disabled','info'); return; }
  if(!donation.phone || !/^\d{10}$/.test(String(donation.phone).replace(/\D/g,''))){ toast('No valid phone','warn'); return; }
  const msg = buildSMS(donation);
  const channel = state.settings.smsChannel || 'sms';
  const attachImage = state.settings.smsAttachImage !== false;
  let imageBlob = null, imageDataURL = null;
  if(attachImage){
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-backdrop" id="mb"><div class="modal"><div class="modal-body"><div class="receipt-img-loading"><div style="font-size:44px;margin-bottom:10px">🖼️</div><div style="font-size:14px;font-weight:700">Generating receipt image…</div></div></div></div></div>`;
    document.body.style.overflow='hidden';
    try{ imageBlob = await generateReceiptImage(donation); imageDataURL = await blobToDataURL(imageBlob); }
    catch(e){ console.warn(e); imageBlob = null; }
    root.innerHTML = ''; document.body.style.overflow='';
  }
  let secondsLeft = 5;
  const modal = openModal({
    title:'📤 Sending Receipt…', hideSubmit:true,

/* VOICE */
let activeRecognition = null;
function hasSpeechSupport(){ return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window; }
function startVoice(btn, target){
  if(!hasSpeechSupport()){ toast('Voice not supported','warn'); return; }
  if(activeRecognition){ try{ activeRecognition.stop(); }catch(e){} activeRecognition=null; }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SpeechRec();
  rec.lang='en-IN'; rec.continuous=false; rec.interimResults=true; rec.maxAlternatives=1;
  const originalValue = target.value;
  btn.classList.add('listening'); btn.textContent='⏹';
  toast('🎤 Listening…','info');
  rec.onresult = (e)=>{ let final='',interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const tr = e.results[i][0].transcript; if(e.results[i].isFinal) final += tr; else interim += tr; } const add = (final||interim).trim(); target.value = (originalValue + (originalValue?' ':'') + add).replace(/\s+/g,' '); target.dispatchEvent(new Event('input',{bubbles:true})); };
  rec.onerror = (e)=>{ btn.classList.remove('listening'); btn.textContent='🎤'; if(e.error!=='aborted') toast('Voice error: '+e.error,'err'); };
  rec.onend = ()=>{ btn.classList.remove('listening'); btn.textContent='🎤'; activeRecognition=null; if(target.value!==originalValue) toast('Voice captured ✓'); };
  try{ rec.start(); activeRecognition = rec; }catch(err){ toast('Mic failed','err'); btn.classList.remove('listening'); btn.textContent='🎤'; }
}
function stopVoice(){ if(activeRecognition){ try{ activeRecognition.stop(); }catch(e){} activeRecognition=null; } }
function attachVoiceInputs(root=document){
  if(!hasSpeechSupport()) return;
  $$('input[type="text"], input[type="tel"], input[type="number"], input[type="email"], textarea', root).forEach(inp=>{
    if(inp.dataset.voiceBound) return;
    if(inp.type==='password'||inp.readOnly||inp.disabled) return;
    inp.dataset.voiceBound='1';
    const wrap = inp.parentElement; if(!wrap) return;
    wrap.style.position = 'relative';
    const btn = document.createElement('button');
    btn.type='button'; btn.className='mic-btn'+(inp.tagName==='TEXTAREA'?' ta':''); btn.textContent='🎤'; btn.title='Speak';
    btn.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); startVoice(btn, inp); });
    wrap.appendChild(btn);
  });
}

/* TOAST / MODAL */
function toast(msg,type='success'){
  const el = document.createElement('div');
  el.className = 'toast '+(type==='success'?'':type);
  const ico = type==='err'?'⚠️':type==='warn'?'⚡':type==='info'?'ℹ️':'✅';
  el.innerHTML = `<span>${ico}</span><span>${esc(msg)}</span>`;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s,transform .25s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),260); }, 2800);
}
function openModal({ title, body, submitText='Save', onSubmit, wide=false, hideSubmit=false, extraFoot='' }){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="mb"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-head"><div class="modal-handle"></div><h3>${esc(title)}</h3><button class="icon-btn" data-close type="button">✕</button></div><form class="modal-body" id="modalForm" novalidate>${body}</form><div class="modal-foot"><button class="btn ghost" data-close type="button">Cancel</button>${extraFoot}${hideSubmit?'':`<button class="btn primary" type="submit" form="modalForm">${esc(submitText)}</button>`}</div></div></div>`;
  const close = ()=>{ stopVoice(); root.innerHTML=''; document.body.style.overflow=''; };
  document.body.style.overflow='hidden';
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));
  $('#mb').addEventListener('mousedown',e=>{ if(e.target.id==='mb') close(); });
  document.addEventListener('keydown',function onEsc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',onEsc); } });
  const form = $('#modalForm');
  if(onSubmit) form.addEventListener('submit',e=>{ e.preventDefault(); const data = Object.fromEntries(new FormData(form).entries()); const ok = onSubmit(data, form); if(ok!==false) close(); });
  setTimeout(()=>attachVoiceInputs(root), 80);
  return { close, form };
}
function confirmDialog(title,msg,onYes,yesText='Delete'){
  openModal({ title, body:`<p style="font-size:14px;color:var(--text-2);line-height:1.6">${msg}</p>`, submitText:yesText, onSubmit:()=>{ onYes(); return true; } });

}

/* EXPORTS */
function exportExcel(filename, sheetName, headers, rows, title){
  try{
    if(typeof XLSX === 'undefined') throw new Error('SheetJS not loaded');
    const wsData = [];
    if(title){ wsData.push([title]); wsData.push(['Generated: '+new Date().toLocaleString()]); wsData.push([]); }
    wsData.push(headers); rows.forEach(r=>wsData.push(r));
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = headers.map((h,i)=>{ let max = String(h).length; rows.forEach(r=>{ const v=String(r[i]??''); if(v.length>max) max=v.length; }); return { wch: Math.min(Math.max(max+2,10),40) }; });
    if(title) ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (sheetName||'Sheet1').slice(0,31));
    XLSX.writeFile(wb, filename + '.xlsx');
    toast('Excel downloaded');
  }catch(err){ console.warn(err); toast('Excel unavailable','err'); }
}
function exportPDF(filename, title, headers, rows, subtitle){
  try{
    if(typeof window.jspdf === 'undefined') throw new Error('jsPDF not loaded');
    const { jsPDF } = window.jspdf;
    const landscape = headers.length > 5;
    const doc = new jsPDF({ orientation: landscape?'landscape':'portrait', unit:'pt', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    doc.setFillColor(30,64,175); doc.rect(0,0,pageW,60,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(title, 40, 30);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text((subtitle||state.settings.orgName||'UTSAV-FINANCE') + '  ·  ' + new Date().toLocaleString(), 40, 48);
    doc.setTextColor(30,41,59);
    doc.autoTable({ head:[headers], body:rows, startY:80, styles:{ fontSize:9, cellPadding:6, overflow:'linebreak', textColor:[30,41,59] }, headStyles:{ fillColor:[30,64,175], textColor:255, fontStyle:'bold', fontSize:9.5 }, alternateRowStyles:{ fillColor:[248,250,252] }, margin:{ left:40, right:40 }, didDrawPage: ()=>{ const pc = doc.internal.getNumberOfPages(); const pn = doc.internal.getCurrentPageInfo().pageNumber; doc.setFontSize(8); doc.setTextColor(120); doc.text(`Page ${pn} of ${pc}`, pageW-40, doc.internal.pageSize.getHeight()-15, { align:'right' }); doc.text('UTSAV-FINANCE', 40, doc.internal.pageSize.getHeight()-15); } });
    doc.save(filename + '.pdf');
    toast('PDF downloaded');
  }catch(err){ console.warn(err); toast('PDF unavailable','err'); }
}

function kpiCard(label, value, ico, accent, sub){ return `<div class="kpi" style="--accent:${accent}"><div class="kpi-top"><div><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${esc(value)}</div></div><div class="kpi-ico" style="--accent:${accent}">${ico}</div></div><div class="kpi-sub">${esc(sub)}</div></div>`; }
function sortList(list, sortKey){
  const l = list.slice();
  switch(sortKey){
    case 'amount-desc': return l.sort((a,b)=>num(b.amount)-num(a.amount));
    case 'amount-asc':  return l.sort((a,b)=>num(a.amount)-num(b.amount));
    case 'date-desc':   return l.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    case 'date-asc':    return l.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    case 'name-asc':    return l.sort((a,b)=>String(a.donorName||a.paidTo||a.name||'').localeCompare(String(b.donorName||b.paidTo||b.name||'')));
    case 'name-desc':   return l.sort((a,b)=>String(b.donorName||b.paidTo||b.name||'').localeCompare(String(a.donorName||a.paidTo||a.name||'')));
    default: return l;
  }
}
function sortOptions(){ return [{v:'amount-desc',l:'💰 Amount: High → Low'},{v:'amount-asc',l:'💰 Amount: Low → High'},{v:'date-desc',l:'📅 Date: Newest first'},{v:'date-asc',l:'📅 Date: Oldest first'},{v:'name-asc',l:'🔤 Name: A → Z'},{v:'name-desc',l:'🔤 Name: Z → A'}]; }

/* REPORTS */
function renderReports(){
  const evs = state.activeEventId==='all' ? state.events : state.events.filter(e=>e.id===state.activeEventId);
  const rows = evs.map(ev=>{ const d = state.donations.filter(x=>x.eventId===ev.id).reduce((s,x)=>s+num(x.amount),0); const e = state.expenses.filter(x=>x.eventId===ev.id).reduce((s,x)=>s+num(x.amount),0); const p = state.pendings.filter(x=>x.eventId===ev.id).reduce((s,x)=>s+Math.max(0,num(x.amount)-num(x.collected)),0); return { ev, d, e, p, bal:d-e }; });
  const totalsRow = rows.reduce((a,r)=>({d:a.d+r.d,e:a.e+r.e,p:a.p+r.p,bal:a.bal+r.bal}),{d:0,e:0,p:0,bal:0});
  const byCat = {}; scoped(state.expenses).forEach(x=>{ byCat[x.category]=(byCat[x.category]||0)+num(x.amount); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const catTotal = cats.reduce((s,c)=>s+c[1],0);
  const byMethod = {}; scoped(state.donations).forEach(x=>{ byMethod[x.method]=(byMethod[x.method]||0)+num(x.amount); });
  const methods = Object.entries(byMethod).sort((a,b)=>b[1]-a[1]);
  const byMonth = {}; scoped(state.donations).forEach(x=>{ const m=(x.date||'').slice(0,7); if(m) byMonth[m]=(byMonth[m]||0)+num(x.amount); });
  const months = Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])); const monthMax = Math.max(1,...months.map(m=>m[1]));
  const t = totals(); const sevaCount = scoped(state.sevaItems).length;
  return `
  <div class="toolbar" style="padding:0 0 16px;border:none"><span class="spacer"></span><button class="btn excel sm" data-act="excel-full-report">📊 Full Excel</button><button class="btn pdf sm" data-act="pdf-full-report">📄 Full PDF</button><button class="btn ghost sm" data-act="print-report">🖨 Print</button></div>
  <div class="sum-strip">
    <div class="sum-cell"><div class="sc-l">Events</div><div class="sc-v">${state.events.length}</div></div>
    <div class="sum-cell"><div class="sc-l">Donations</div><div class="sc-v" style="color:var(--success)">${money(t.donations)}</div></div>
    <div class="sum-cell"><div class="sc-l">Expenses</div><div class="sc-v" style="color:var(--danger)">${money(t.expenses)}</div></div>
    <div class="sum-cell"><div class="sc-l">Balance</div><div class="sc-v">${money(t.balance)}</div></div>
    <div class="sum-cell"><div class="sc-l">Pending</div><div class="sc-v" style="color:var(--warn)">${money(t.pendingAmt)}</div></div>
    <div class="sum-cell"><div class="sc-l">Seva</div><div class="sc-v">${sevaCount}</div></div>
  </div>
  <div class="card mb16">
    <div class="card-head"><h3>Event-wise Summary</h3></div>
    ${rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Event</th><th>Date</th><th class="t-right">Budget</th><th class="t-right">Donations</th><th class="t-right">Expenses</th><th class="t-right">Balance</th><th class="t-right">Pending</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><div class="cu-name">${esc(r.ev.name)}</div><div class="cu-sub">${esc(r.ev.location||'—')}</div></td><td>${fmtDate(r.ev.date)}</td><td class="t-right num">${r.ev.budget?money(r.ev.budget):'—'}</td><td class="t-right num amt-in">${money(r.d)}</td><td class="t-right num amt-out">${money(r.e)}</td><td class="t-right num" style="color:${r.bal>=0?'var(--success)':'var(--danger)'}">${money(r.bal)}</td><td class="t-right num" style="color:var(--warn)">${money(r.p)}</td></tr>`).join('')}
    </tbody><tfoot><tr style="background:var(--card-alt);font-weight:800"><td colspan="3">TOTAL</td><td class="t-right num amt-in">${money(totalsRow.d)}</td><td class="t-right num amt-out">${money(totalsRow.e)}</td><td class="t-right num">${money(totalsRow.bal)}</td><td class="t-right num">${money(totalsRow.p)}</td></tr></tfoot></table></div>` : emptyState('📈','No events to report','Create an event.','add-event','Create Event')}
  </div>
  <div class="grid-2e">
    <div class="card"><div class="card-head"><h3>Expense Categories</h3></div><div class="card-body">${cats.length ? cats.map((c,i)=>`<div class="cat-row"><div class="cat-top"><span>${esc(c[0])}</span><span class="cv">${money(c[1])} · ${catTotal?Math.round((c[1]/catTotal)*100):0}%</span></div><div class="cat-bar"><i style="width:${(c[1]/cats[0][1])*100}%;background:${['#1e40af','#0891b2','#ec4899','#f59e0b','#10b981','#7c3aed'][i%6]}"></i></div></div>`).join('') : ''}</div></div>
    <div class="card"><div class="card-head"><h3>Donations by Method</h3></div><div class="card-body">${methods.length ? methods.map((m,i)=>{ const tot = methods.reduce((s,x)=>s+x[1],0); return `<div class="cat-row"><div class="cat-top"><span>${esc(m[0])}</span><span class="cv">${money(m[1])} · ${tot?Math.round((m[1]/tot)*100):0}%</span></div><div class="cat-bar"><i style="width:${(m[1]/methods[0][1])*100}%;background:${['#16a34a','#0891b2','#1e40af','#7c3aed','#f59e0b','#ec4899'][i%6]}"></i></div></div>`; }).join('') : ''}</div></div>
  </div>
  ${months.length ? `<div class="card" style="margin-top:16px"><div class="card-head"><h3>Monthly Donation Trend</h3></div><div class="card-body"><div class="chart">${months.map(m=>`<div class="chart-col"><div class="chart-bars"><i class="bar-in" style="height:${Math.max(4,(m[1]/monthMax)*100)}%"></i></div><span class="chart-lbl">${new Date(m[0]+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'2-digit'})}</span></div>`).join('')}</div></div></div>` : ''}`;
}

/* BIND */
function bindView(){
  const sMap = { donations:'#dSearch', expenses:'#eSearch', pending:'#pSearch', receipts:'#rSearch', users:'#uSearch', seva:'#sSearch' };
  const sel = sMap[ui.view];
  if(sel){ const inp = $(sel); if(inp) inp.addEventListener('input', debounce(e=>{ ui.search = e.target.value; const pos = e.target.selectionStart; render(); const ni = $(sel); if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); } },140)); }
  const fMap = { donations:'#dFilter', expenses:'#eFilter' };
  if(fMap[ui.view]){ const f = $(fMap[ui.view]); if(f) f.addEventListener('change',e=>{ ui.filter = e.target.value; render(); }); }
  const sortMap = { donations:'#dSort', expenses:'#eSort', pending:'#pSort', seva:'#sSort' };
  if(sortMap[ui.view]){ const s = $(sortMap[ui.view]); if(s) s.addEventListener('change',e=>{ ui.sort = e.target.value; render(); }); }
  const seg = $('#pSeg'); if(seg) $$('#pSeg button').forEach(b=>b.addEventListener('click',()=>{ ui.filter = b.dataset.f; render(); }));

  const smsToggle = $('#smsToggle'); if(smsToggle) $$('#smsToggle button').forEach(b=>b.addEventListener('click',()=>{ state.settings.smsEnabled = b.dataset.v==='on'; save(); render(); toast('Auto-send '+(state.settings.smsEnabled?'enabled':'disabled')); }));
  const smsImgToggle = $('#smsImgToggle'); if(smsImgToggle) $$('#smsImgToggle button').forEach(b=>b.addEventListener('click',()=>{ state.settings.smsAttachImage = b.dataset.v==='on'; save(); render(); toast('Image '+(state.settings.smsAttachImage?'attached':'disabled')); }));
  const smsChannel = $('#smsChannel'); if(smsChannel) $$('#smsChannel button').forEach(b=>b.addEventListener('click',()=>{ state.settings.smsChannel = b.dataset.v; save(); render(); toast('Channel: '+b.textContent.trim()); }));
  const smsTpl = $('#smsTemplate');
  if(smsTpl) smsTpl.addEventListener('input', e=>{
    const v = e.target.value;
    const sample = { donorName:'Rajesh Bhai', amount:1100, eventId: state.activeEventId!=='all'?state.activeEventId:(state.events[0]?.id||''), phone:'' };
    let prev = v.replace(/\{name\}/g,'Rajesh Bhai').replace(/\{amount\}/g,money(1100)).replace(/\{event\}/g, eventName(sample.eventId)||'our event');
    const el = $('#smsPreview'); if(el) el.textContent = prev;
    const cc = $('#smsCharCount'); if(cc) cc.textContent = prev.length + ' chars';
    const sg = $('#smsSegments'); if(sg) sg.textContent = '≈ ' + Math.ceil(prev.length/160) + ' SMS segment(s)';
  });
  $$('[data-insert]').forEach(p=>p.addEventListener('click',()=>{ const ta = $('#smsTemplate'); if(ta){ ta.value += p.dataset.insert; ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus(); } }));
  $$('[data-theme-set]').forEach(sw=>sw.addEventListener('click',()=>setTheme(sw.dataset.themeSet)));

  $$('[data-logo-preset]').forEach(el=>el.addEventListener('click',()=>{
    const v = el.dataset.logoPreset;
    state.settings.logoType = v; save(); applyLogo(); render(); toast('Logo updated ✓');
  }));
  const upZone = $('#logoUploadZone');
  const upInput = $('#logoFileInput');
  if(upZone && upInput){
    upZone.addEventListener('click',()=>upInput.click());
    upInput.addEventListener('change',(e)=>{
      const file = e.target.files[0]; if(!file) return;
      if(file.size > 2*1024*1024){ toast('Image too large (max 2MB)','err'); e.target.value=''; return; }
      const reader = new FileReader();
      reader.onload = (ev)=>{ state.settings.logoCustom = ev.target.result; state.settings.logoType = 'custom'; save(); applyLogo(); render(); toast('Custom logo applied ✓'); };
      reader.readAsDataURL(file);
    });
  }

  $$('[data-bg-set]').forEach(el=>el.addEventListener('click',()=>{
    const v = el.dataset.bgSet;
    if(v === 'custom'){ const bgInput = $('#bgFileInput'); if(bgInput) bgInput.click(); return; }
    state.settings.loginBg = v; save(); applyLoginBackground(); render(); toast('Login background updated ✓');
  }));
  const bgInput = $('#bgFileInput');
  if(bgInput) bgInput.addEventListener('change',(e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 3*1024*1024){ toast('Image too large (max 3MB)','err'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{ state.settings.loginBgCustom = ev.target.result; state.settings.loginBg = 'custom'; save(); applyLoginBackground(); render(); toast('Custom background applied ✓'); };
    reader.readAsDataURL(file);
  });

  const sf = $('#sevaQuickForm');
  if(sf) sf.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(sf);
    const name = (fd.get('name')||'').toString().trim();
    const item = (fd.get('item')||'').toString().trim();
    const mobile = (fd.get('mobile')||'').toString().trim();
    if(!name) return toast('Name required','err');
    if(!item) return toast('Item required','err');
    if(mobile && !/^\d{10}$/.test(mobile)) return toast('Mobile must be 10 digits','err');
    const evId = state.activeEventId!=='all' ? state.activeEventId : (state.events[0]?.id || '');
    state.sevaItems.push({ id:uid('sv'), eventId:evId, name, item, mobile, note:'', date:todayISO() });
    save(); sf.reset(); toast('Seva item saved'); render(); scrollToSevaForm();
  });
  const sc = $('#sevaClearBtn'); if(sc) sc.addEventListener('click',()=>{ const f=$('#sevaQuickForm'); if(f) f.reset(); toast('Form cleared','info'); });

  $('#mSearchBtn').style.display = isMobile()?'grid':'none';
}

function setTheme(theme){
  state.settings.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const colors = { indigo:'#1e40af', ocean:'#0891b2', emerald:'#059669', sunset:'#ea580c', rose:'#e11d48' };
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', colors[theme]||'#1e40af');
  save();
  if(ui.view==='settings'||ui.view==='sms') render();
  toast('Theme changed','info');
}

document.addEventListener('change', e=>{

  const p = state.pendings.find(x=>x.id===id); if(!p) return;

  openModal({

    body:`<div style="background:var(--card-alt);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13.5px;font-weight:750">${esc(p.name)}</div><div style="font-size:11.5px;color:var(--muted);font-weight:600">Outstanding</div></div><div style="font-size:19px;font-weight:800;color:var(--warn)">${money(due)}</div></div>

      p.status = p.collected >= num(p.amount) ? 'paid' : 'pending';
