  .rc-f{padding:14px 22px 20px;display:flex;justify-content:space-between}
  .sig{border-top:1px solid #94a3b8;padding-top:5px;font-size:11px;color:#64748b;font-weight:600;min-width:120px;text-align:center}
  .note{font-size:11.5px;color:#94a3b8;text-align:center;margin-top:16px}
  @media print{body{padding:0}}</style></head><body>
  <div class="rc"><div class="rc-h">${logoHTML}<div><h1>${esc(state.settings.orgName||'UTSAV-FINANCE')}</h1><p>Official Donation Receipt ${ev?'· '+esc(ev.name):''}</p></div></div>
    <div class="rc-b">
      <div class="row"><span class="k">Receipt No.</span><span class="v">${esc(d.receiptNo||'—')}</span></div>
      <div class="row"><span class="k">Date</span><span class="v">${fmtDate(d.date)}</span></div>
      <div class="row"><span class="k">Received From</span><span class="v">${esc(d.donorName)}</span></div>
      ${d.phone?`<div class="row"><span class="k">Phone</span><span class="v">${esc(d.phone)}</span></div>`:''}
      <div class="row"><span class="k">Payment Mode</span><span class="v">${esc(d.method)}</span></div>
      ${ev?`<div class="row"><span class="k">Event</span><span class="v">${esc(ev.name)}</span></div>`:''}
      ${d.note?`<div class="row"><span class="k">Remarks</span><span class="v">${esc(d.note)}</span></div>`:''}
      <div class="amt"><div class="l">Amount Received</div><div class="n">${money(d.amount)}</div></div>
    </div>
    <div class="rc-f"><div class="sig">Donor</div><div class="sig">Treasurer</div></div></div>
  <p class="note">Thank you for your generous contribution 🙏 · Together for a Better Utsav</p></body></html>`;
}
function showReceipt(id){
  const d = state.donations.find(x=>x.id===id); if(!d) return;
  openModal({
    title:'Receipt '+(d.receiptNo||''), wide:true, hideSubmit:true,
    body:`<div class="seg" id="rcViewTabs" style="margin-bottom:12px;display:inline-flex">
      <button type="button" class="active" data-rcview="html">📄 Receipt View</button>
      <button type="button" data-rcview="image">🖼️ Image View</button>
    </div>
    <div id="rcViewHtml" style="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff"><iframe style="width:100%;height:520px;border:none;display:block" srcdoc="${receiptHTML(d).replace(/"/g,'&quot;')}"></iframe></div>
    <div id="rcViewImage" style="display:none;text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--card-alt);min-height:220px;padding:16px">
      <div id="rcImgLoading" style="padding:60px 0;color:var(--muted);font-size:13px;font-weight:600">🖼️ Generating image preview…</div>
      <img id="rcImgTag" style="display:none;max-width:100%;border-radius:8px;box-shadow:var(--shadow)">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button type="button" class="btn primary" style="flex:1;min-width:100px" onclick="window.printReceipt('${d.id}')">🖨 Print</button>
      <button type="button" class="btn img" style="flex:1;min-width:100px" onclick="window.__dlImg('${d.id}')">🖼️ Save Image</button>
      ${d.phone?`<button type="button" class="btn wa" style="flex:1;min-width:100px" onclick="window.__shareImg('${d.id}')">💬 Share</button>`:''}
    </div>`
  });
  const loadImagePreview = async ()=>{
    const imgTag = document.getElementById('rcImgTag'), loading = document.getElementById('rcImgLoading');
    if(!imgTag || imgTag.dataset.loaded) return;
    try{ const blob = await generateReceiptImage(d); const url = await blobToDataURL(blob); imgTag.src = url; imgTag.style.display='block'; imgTag.dataset.loaded='1'; if(loading) loading.style.display='none'; }
    catch(e){ if(loading) loading.textContent = '⚠️ Image generation failed'; }
  };
  const tabs = document.getElementById('rcViewTabs');
  if(tabs) tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
    tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const htmlV = document.getElementById('rcViewHtml'), imgV = document.getElementById('rcViewImage');
    if(b.dataset.rcview==='html'){ htmlV.style.display='block'; imgV.style.display='none'; }
    else{ htmlV.style.display='none'; imgV.style.display='block'; loadImagePreview(); }
  }));
  window.__dlImg = async (did)=>{ const dd = state.donations.find(x=>x.id===did); if(dd) await downloadReceiptImage(dd); };
  window.__shareImg = async (did)=>{ const dd = state.donations.find(x=>x.id===did); if(dd){ document.querySelector('#modalRoot').innerHTML=''; await shareReceiptImage(dd, buildSMS(dd)); render(); } };
}
function printReceipt(id){
  const d = state.donations.find(x=>x.id===id); if(!d) return;
  const w = window.open('','_blank','width=620,height=760');
  if(!w){ toast('Allow pop-ups','warn'); return; }
  w.document.write(receiptHTML(d)); w.document.close(); w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
}
window.printReceipt = printReceipt;
window.openSMSApp = openSMSApp;
window.openWhatsApp = openWhatsApp;
window.copyToClipboard = copyToClipboard;
window.autoSendSMS = autoSendSMS;
window.generateReceiptImage = generateReceiptImage;
window.shareReceiptImage = shareReceiptImage;
window.downloadReceiptImage = downloadReceiptImage;

/* DETAIL VIEW HELPERS */
function detailRow(label, value){ return `<div style="display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px"><span style="color:var(--muted);font-weight:600">${esc(label)}</span><span style="font-weight:800;text-align:right">${value}</span></div>`; }
function closeModalNow(){ const r = document.querySelector('#modalRoot'); if(r) r.innerHTML=''; document.body.style.overflow=''; }
function viewExpense(id){
  const e = state.expenses.find(x=>x.id===id); if(!e) return toast('Not found','err');
  const ev = state.events.find(x=>x.id===e.eventId);
  openModal({
    title:'💸 Expense Details', hideSubmit:true,
    body:`<div>
      ${detailRow('Voucher No', esc(e.voucherNo||'—'))}
      ${detailRow('Paid To', esc(e.paidTo||'—'))}
      ${detailRow('Category', esc(e.category||'—'))}
      ${detailRow('Amount', money(e.amount))}
      ${detailRow('Payment Method', esc(e.method||'—'))}
      ${detailRow('Date', fmtDate(e.date))}
      ${ev?detailRow('Event', esc(ev.name)):''}
      ${e.note?detailRow('Note', esc(e.note)):''}
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button type="button" class="btn ghost" style="flex:1;min-width:100px" onclick="closeModalNow();expenseForm('${e.id}')">✏️ Edit</button>
      <button type="button" class="btn danger" style="flex:1;min-width:100px" onclick="closeModalNow();confirmDialog('Delete Expense','Delete?',()=>{ state.expenses = state.expenses.filter(x=>x.id!=='${e.id}'); save(); render(); toast('Deleted'); })">🗑 Delete</button>
    </div>`
  });
}
function viewPending(id){
  const p = state.pendings.find(x=>x.id===id); if(!p) return toast('Not found','err');
  const amt=num(p.amount), col=num(p.collected), due=Math.max(0,amt-col), pct=amt?Math.min(100,Math.round((col/amt)*100)):0, cleared=due<=0;
  openModal({
    title:'⏳ Pending Details', hideSubmit:true,
    body:`<div>
      ${detailRow('Name', esc(p.name))}
      ${p.phone?detailRow('Phone', esc(p.phone)):''}
      ${detailRow('Pledged', money(amt))}
      ${detailRow('Collected', money(col))}
      ${detailRow('Due', money(due))}
      ${detailRow('Status', cleared?'Cleared':'Pending')}
      ${p.dueDate?detailRow('Due Date', fmtDate(p.dueDate)):''}
      ${p.note?detailRow('Note', esc(p.note)):''}
      <div class="prog ${cleared?'green':'amber'}" style="margin-top:10px"><i style="width:${pct}%"></i></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      ${!cleared?`<button type="button" class="btn success" style="flex:1;min-width:100px" onclick="closeModalNow();collectForm('${p.id}')">＋ Collect</button>`:''}
      <button type="button" class="btn ghost" style="flex:1;min-width:100px" onclick="closeModalNow();pendingForm('${p.id}')">✏️ Edit</button>
    </div>`
  });
}
function viewSeva(id){
  const s = state.sevaItems.find(x=>x.id===id); if(!s) return toast('Not found','err');
  const ev = state.events.find(x=>x.id===s.eventId);
  openModal({
    title:'🪔 Seva Item Details', hideSubmit:true,
    body:`<div>
      ${detailRow('Name', esc(s.name))}
      ${detailRow('Item', esc(s.item))}
      ${s.mobile?detailRow('Mobile', esc(s.mobile)):''}
      ${detailRow('Date', fmtDate(s.date))}
      ${ev?detailRow('Event', esc(ev.name)):''}
      ${s.note?detailRow('Note', esc(s.note)):''}
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button type="button" class="btn ghost" style="flex:1;min-width:100px" onclick="closeModalNow();sevaEditForm('${s.id}')">✏️ Edit</button>
    </div>`
  });
}
window.closeModalNow = closeModalNow;
window.viewExpense = viewExpense;
window.viewPending = viewPending;
window.viewSeva = viewSeva;

/* AUTH */
function checkAuth(){
  try{ const sess = localStorage.getItem(AUTH_KEY); if(!sess) return false; const data = JSON.parse(sess); return data && data.user === CREDS.user && (Date.now() - data.ts) < 7*24*60*60*1000; }catch(e){ return false; }
}
function setAuth(){ localStorage.setItem(AUTH_KEY, JSON.stringify({ user: CREDS.user, ts: Date.now() })); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function showLogin(){ $('#loginScreen').classList.remove('hide'); setTimeout(()=>$('#loginUser').focus(), 300); }
function hideLogin(){
  $('#loginScreen').classList.add('hide');
  $('#app').classList.add('show');
  setTimeout(()=>{
    renderNav(); render();
    const admin = state.users.find(u=>u.active) || state.users[0];
    if(admin){ $('#meAvatar').textContent = initials(admin.name); $('#meName').textContent = admin.name; $('#meRole').textContent = admin.role; }
  }, 100);
}
$('#togglePw').addEventListener('click',()=>{ const inp = $('#loginPass'); const isPw = inp.type === 'password'; inp.type = isPw ? 'text' : 'password'; $('#togglePw').textContent = isPw ? '🙈' : '👁'; });
function attemptLogin(){
  const u = $('#loginUser').value.trim(); const p = $('#loginPass').value;
  const err = $('#loginErr');
  if(u === CREDS.user && p === CREDS.pass){
    err.classList.remove('show'); setAuth();
    $('#loginScreen').classList.add('hide');
    setTimeout(()=>hideLogin(), 250);
  } else { err.classList.add('show'); setTimeout(()=>err.classList.remove('show'), 3000); toast('Invalid credentials','err'); }
}
$('#loginBtn').addEventListener('click', attemptLogin);
$('#loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loginPass').focus(); });
$('#loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
$('#logoutBtn').addEventListener('click', ()=>{
  confirmDialog('Logout','Are you sure?',()=>{
    clearAuth(); $('#app').classList.remove('show'); showLogin();
    $('#loginUser').value = CREDS.user; $('#loginPass').value = '';
  },'Logout');
});

/* BOOT */
function boot(){
  load();
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'indigo');
  const themeColors = { indigo:'#1e40af', ocean:'#0891b2', emerald:'#059669', sunset:'#ea580c', rose:'#e11d48' };
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', themeColors[state.settings.theme] || '#1e40af');
  applyLogo();
  applyLoginBackground();
  setTimeout(()=>{
    $('#splash').classList.add('hide');
    setTimeout(()=>{
      if(checkAuth()) hideLogin();
      else { showLogin(); $('#loginUser').value = CREDS.user; }
    }, 300);
  }, 2200);
}

$('#menuBtn').addEventListener('click',()=>toggleSidebar());
$('#overlay').addEventListener('click',()=>toggleSidebar(false));
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ toggleSidebar(false); closeFab(); stopVoice(); }
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    if(e.key==='d'){ e.preventDefault(); go('donations'); donationForm(); }
    if(e.key==='e'){ e.preventDefault(); go('expenses'); expenseForm(); }
    if(e.key==='s'){ e.preventDefault(); go('seva'); setTimeout(scrollToSevaForm,100); }
  }
});
window.addEventListener('resize', debounce(()=>{
  $('#mSearchBtn').style.display = isMobile()?'grid':'none';
  if(ui.view && $('#app').classList.contains('show')) render();
},300));

boot();
</script>
